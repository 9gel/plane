name: Build and Push to GHCR

on:
  push:
    branches:
      - v1.4.0-patch
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag"
        required: true
        default: "v1.4.0-patch"

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lower case owner name
        run: |
          echo "IMAGE_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./apps/api
          file: ./apps/api/Dockerfile.api
          push: true
          tags: ghcr.io/${{ env.IMAGE_OWNER }}/plane-backend:${{ github.event.inputs.tag || 'v1.4.0-patch' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/web/Dockerfile.web
          push: true
          tags: ghcr.io/${{ env.IMAGE_OWNER }}/plane-frontend:${{ github.event.inputs.tag || 'v1.4.0-patch' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
